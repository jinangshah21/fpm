name = "fpm"
version = "0.12.0"
license = "MIT"
author = "fpm maintainers"
maintainer = "@fortran-lang/fpm"
copyright = "2020-2025 fpm contributors"
homepage = "https://fpm.fortran-lang.org/"
description = "Fortran Package Manager"

[preprocess]
[preprocess.cpp]
macros=["FPM_RELEASE_VERSION={version}"]

[dependencies]
toml-f.git = "https://github.com/toml-f/toml-f.git"
toml-f.rev = "27abd768e79c7c790ffa58fe5ccfb105ba00883d"
M_CLI2.git = "https://github.com/jinangshah21/M_CLI2.git"
M_CLI2.rev = "108f0b5598df2bd8ec7a2dffe56017d58520fdfc"
fortran-regex.git  = "https://github.com/perazz/fortran-regex.git"
fortran-regex.rev  = "96ab33fe003862a28cec91ddd170ac0e86c26c87"
jonquil.git = "https://github.com/jinangshah21/jonquil.git"
jonquil.rev = "8aad5a901810bd669e851eead633c0df2bb7b423"
fortran-shlex.git = "https://github.com/perazz/fortran-shlex"
fortran-shlex.rev = "e20b6f86c82e33fae78b54b074bab5369efde6a3"

[[test]]
name = "cli-test"
source-dir = "test/cli_test"
main = "cli_test.f90"

[[test]]
name = "new-test"
source-dir = "test/new_test"
main = "new_test.f90"

[[test]]
name = "fpm-test"
source-dir = "test/fpm_test"
main = "main.f90"

[[test]]
name = "help-test"
source-dir = "test/help_test"
main = "help_test.f90"

